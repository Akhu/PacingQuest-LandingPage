# Deploys to the production Cloudflare Pages branch: only run for main,
# so pushing a feature branch never publishes the site.
on:
  push:
    branches: [main]

jobs:
  publish:
    runs-on: macos-latest
    permissions:
      contents: read
      deployments: write
    name: Build & Publish to Cloudflare Pages
    steps:
      - name: Checkout
        uses: actions/checkout@v3
      - name: Setup Node.js environment
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Setup Pacing-Quest Landing...
        run: echo "Startup build and deploy..."
      - name: Installing dependencies
        run: npm install
        working-directory: ./
      - name: Build Site
        run: SITE=${{ vars.SITE }} npm run build
        working-directory: ./
      - name: Publish to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: 6d8a30b3ac9ba18554c27b86a4d4c98b
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
          command: pages deploy dist --project-name=pacing-quest --branch=main
          # Optional: Change the working directory
          #workingDirectory: dist
          # Optional: Change the Wrangler version, allows you to point to a specific version or a tag such as `beta`
          wranglerVersion: "3"
